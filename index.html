<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vegas Welcome Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap">
<style>
/* Vegas App Glass tokens: cream UI, ink text, espresso actions, gold brand diamond, liquid-glass sheet. */
:root{
  --ui-bg:#efede7; --ui-bg-2:#faf8f4; --cream:#f0e9d8;
  --text:#4d3d2e; --text-2:#76634f; --line:#e6dfcf; --ink:#2b2118;
  --espresso:#624f3d; --hero-b:#4b3b2d; --hero-c:#3d3025; --taupe:#9c8570;
  --gold:#f1ca6d; --gold-hi:#f8dd93; --gold-lo:#dcae48; --gold-deep:#a8791f; --red:#ed1c24;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.45,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(55% 45% at 22% 18%,rgba(241,202,109,.12),transparent 62%),linear-gradient(170deg,#261c15,#120d0a 58%,#0b0806)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input{font:inherit;color:inherit}
h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--espresso);outline-offset:2px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.dm{height:var(--h,14px);width:calc(var(--h,14px) * .523);flex:none;display:block;fill:url(#vg-gold)}
.ic{width:var(--s,18px);height:var(--s,18px);flex:none;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* device */
.stage{flex:none;transform-origin:center}
.device{position:relative;width:393px;height:852px;border-radius:58px;overflow:hidden;background:var(--ui-bg);
  box-shadow:0 0 0 10px #0b0806,0 0 0 11.5px #4a3b2e,0 0 0 12.5px #1c1510,0 50px 90px -24px rgba(0,0,0,.75)}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.island{position:absolute;z-index:95;top:11px;left:50%;width:31%;height:33px;transform:translateX(-50%);border-radius:20px;background:#000}
.homebar{position:absolute;z-index:95;bottom:8px;left:50%;width:35%;height:5px;transform:translateX(-50%);border-radius:3px;background:rgba(43,33,24,.38)}

/* liquid glass */
.lg{position:relative;isolation:isolate;background:var(--lg-bg);-webkit-backdrop-filter:var(--lg-bf);backdrop-filter:var(--lg-bf);box-shadow:var(--lg-sh)}
.lg::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,1) 0%,rgba(255,255,255,.14) 26%,rgba(255,255,255,0) 48%,rgba(255,255,255,.08) 70%,rgba(255,255,255,.95) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.lg.lt{--lg-bg:linear-gradient(180deg,rgba(252,250,246,.96),rgba(248,245,239,.93));--lg-bf:blur(18px) saturate(1.5);
  --lg-sh:0 24px 60px -18px rgba(30,18,8,.55),0 1px 2px rgba(98,79,61,.10),inset 0 0 0 .5px rgba(98,79,61,.12)}

/* scrim + sheet */
.scrim{position:absolute;inset:0;z-index:80;background:rgba(40,28,18,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:81;left:8px;right:8px;bottom:22px;max-height:calc(100% - 70px);display:flex;flex-direction:column;border-radius:38px;overflow:hidden;
  transform:translateY(calc(100% + 40px));transition:transform .6s var(--ease)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(98,79,61,.22);margin:10px auto 0;flex:none}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 0;flex:none;min-height:44px}
.dots{display:flex;align-items:center;gap:8px}
.dots .o{fill:none;stroke:var(--taupe);stroke-width:9;opacity:.6}
.dots .cur{--h:20px}
.cnt{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2)}
.xbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:rgba(98,79,61,.08)}
.xbtn .ic{--s:16px}
.body{padding:14px 20px 4px;overflow-y:auto;scrollbar-width:none;flex:1;min-height:0}
.body::-webkit-scrollbar{display:none}
.slide{animation:qin .45s var(--ease) both}
.slide.back{animation-name:qback}
@keyframes qin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes qback{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:.6875rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2)}
.body h3{margin-top:6px;font-size:1.375rem;font-weight:700;letter-spacing:-.015em;line-height:1.25;color:var(--ink)}
.help{margin-top:6px;font-size:.8125rem;color:var(--text-2)}

/* options: full-width rows, 56px targets */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:12px 16px;border-radius:18px;background:#fff;
  box-shadow:inset 0 0 0 1px rgba(98,79,61,.12),0 4px 12px -8px rgba(60,40,20,.25);transition:box-shadow .25s,background .25s,transform .2s var(--spring)}
.opt:active{transform:scale(.985)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:.9375rem;font-weight:600;color:var(--ink);line-height:1.3}
.opt .t small{display:block;margin-top:2px;font-size:.8125rem;color:var(--text-2);line-height:1.35}
.box{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1.5px #b9a994;transition:background .25s,box-shadow .25s}
.box.rd{border-radius:50%}
.box .ic{--s:14px;stroke-width:2.6;opacity:0;transform:scale(.4);transition:all .3s var(--spring)}
.opt.on{background:#fffdf8;box-shadow:inset 0 0 0 2px var(--espresso),0 8px 18px -10px rgba(60,40,20,.45)}
.opt.on .box{background:linear-gradient(170deg,var(--espresso),var(--hero-c));box-shadow:none}
.opt.on .box .ic{opacity:1;transform:none}
.opt.on .t b{font-weight:700}
.opt.lead .t b{display:flex;align-items:center;gap:8px}
.other{display:none;margin:-2px 0 2px;padding:0 4px}
.other.on{display:block;animation:qin .35s var(--ease)}
.other input{width:100%;height:50px;padding:0 16px;border:0;border-radius:16px;background:#fff;font-size:.9375rem;color:var(--ink);outline:0;
  box-shadow:inset 0 0 0 1.5px rgba(98,79,61,.2)}
.other input:focus{box-shadow:inset 0 0 0 2px var(--espresso)}
.other input::placeholder{color:#a8988a}

.consent{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px 16px;border-radius:18px;width:100%;background:var(--cream);text-align:left}
.consent .box{width:22px;height:22px;margin-top:1px}
.consent.on .box{background:linear-gradient(170deg,var(--espresso),var(--hero-c));box-shadow:none}
.consent.on .box .ic{opacity:1;transform:none}
.consent b{display:block;font-size:.8125rem;font-weight:700;color:var(--ink)}
.consent p{margin-top:3px;font-size:.75rem;color:var(--text-2);line-height:1.5}
.consent.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* footer */
.foot{display:flex;align-items:center;gap:10px;padding:14px 20px 20px;flex:none}
.btn-dark{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:999px;color:#fff;font-size:.8125rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:radial-gradient(60% 120% at 15% 0%,rgba(241,202,109,.28),transparent 60%),linear-gradient(170deg,var(--espresso),var(--hero-b) 58%,var(--hero-c));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 14px 26px -14px rgba(60,40,20,.8);transition:transform .2s var(--spring),opacity .3s,filter .3s}
.btn-dark:active{transform:scale(.97)}
.btn-dark.off{filter:saturate(.2);opacity:.45;box-shadow:none}
.btn-ghost{height:54px;padding:0 20px;border-radius:999px;font-size:.8125rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--espresso);background:rgba(98,79,61,.08)}
.btn-back{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--espresso);background:rgba(98,79,61,.08);flex:none}
.btn-back .ic{--s:20px}

/* intro + closing */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 6px 4px}
.badge{position:relative;width:84px;height:84px;border-radius:28px;display:grid;place-items:center;margin-bottom:16px;
  background:radial-gradient(70% 70% at 25% 10%,rgba(241,202,109,.35),transparent 60%),linear-gradient(170deg,var(--espresso),var(--hero-b) 58%,var(--hero-c));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 18px 30px -16px rgba(60,40,20,.8)}
.badge .dm{animation:spin 1.2s var(--ease) both;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
@keyframes spin{from{transform:rotateY(540deg) scale(.3);opacity:0}}
.hero .eyebrow{justify-content:center}
.foot{padding-bottom:10px}
.fnote{flex:none;padding:0 28px 18px;text-align:center;font-size:.6875rem;line-height:1.45;color:var(--text-2)}
.hero h3.one{white-space:nowrap;font-size:1.5rem}
.hero h3{max-width:300px}
.foot+.fnote{margin-top:-2px}
.hero h3{font-size:1.625rem}
.hero p{margin-top:10px;font-size:.9375rem;line-height:1.55;color:var(--text);max-width:300px}
.hero .meta{display:flex;gap:16px;justify-content:center;margin-top:16px;font-size:.75rem;font-weight:600;color:var(--text-2)}
.hero .meta span{display:flex;align-items:center;gap:6px}
.conf{position:absolute;z-index:90;top:-30px;pointer-events:none;animation:fall 2.8s ease-in forwards}
@keyframes fall{to{transform:translateY(900px) rotate(420deg)}}
.reopen{position:absolute;z-index:70;left:50%;bottom:120px;transform:translateX(-50%);white-space:nowrap}
.reopen.btn-dark{flex:none;padding:0 24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
var IC={check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',back:'<path d="M15 5l-7 7 7 7"/>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.2l2.8 1.8"/>',lock:'<rect x="6" y="11" width="12" height="9" rx="2.5"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/>'};
function svg(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
function dia(h,o){return '<svg class="dm'+(o?' o':'')+'" style="--h:'+h+'px" viewBox="0 0 140 267.68" aria-hidden="true"><use href="#vg-d"/></svg>'}

/* ---------- content (edit here) ---------- */
var INTRO='So that we may tailor your experience, we would be honoured to learn a little about your preferences.';
var NOTE='Your responses are used solely to tailor your experience and remain strictly confidential.';
var Q=[
 {key:'games',title:'Which games are you most interested in?',multi:true,
  opts:[{v:'Slots'},{v:'Roulette'},{v:'Baccarat'},{v:'All of the above',all:true},{v:'I’m still exploring',solo:true}]},
 {key:'profile',title:'Which of the following best describes you?',multi:false,
  opts:[{v:'Resident of Ho Chi Minh City'},{v:'Resident of a neighbouring province'},{v:'Business traveller'},{v:'Leisure traveller'},{v:'Other'}]},
 {key:'looking',title:'What are you most looking forward to at Vegas Club?',multi:true,optional:true,
  opts:[{v:'The Thrill of the Jackpots'},{v:'The Joy of Discovery new games'},{v:'Privileges & Rewards'},{v:'The Refined Experience'}]},
 {key:'contact',title:'How would you prefer to receive our exclusive offers and events?',multi:true,
  opts:[{v:'Zalo'},{v:'KakaoTalk'},{v:'WhatsApp'},{v:'WeChat'},{v:'Other'}]}
];
var CONSENT_T='Used only to customize your experiences';
var CONSENT_P='Vegas uses these answers only to tailor your offers and experiences at the club. They are not collected or used for any other purpose, and you can update or remove them anytime.';

/* ---------- state ---------- */
var stage='intro', step=0, dir=1, A={}, OT={}, consent=false;
Q.forEach(function(q){A[q.key]=[];OT[q.key]=''});
var $s=document.getElementById('sheet');
var GAMES=['Slots','Roulette','Baccarat'];

function answered(i){return A[Q[i].key].length>0}
function canNext(){var q=Q[step];if(q.optional)return true;if(!answered(step))return false;if(q.consent&&!consent)return false;return true}

function dots(){
  return '<div class="dots" aria-hidden="true">'+Q.map(function(q,i){var cur=i===step&&stage==='q',dn=stage==='done'||(answered(i)&&i!==step);
    return cur?dia(20).replace('class="dm"','class="dm cur"'):dn?dia(14):'<svg class="dm o" style="--h:14px" viewBox="0 0 140 267.68"><use href="#vg-d"/></svg>'}).join('')+'</div>';
}
function render(){
  var cls='slide'+(dir<0?' back':''), html='<div class="grab"></div>';
  if(stage==='intro'){
    html+='<div class="sh-top" style="min-height:14px"></div>'+
      '<div class="body"><div class="hero '+cls+'"><div class="badge">'+dia(44)+'</div><h3 class="one">Welcome to Vegas Club</h3><p>'+INTRO+'</p>'+
      '<div class="meta"><span>'+svg('clock')+'4 questions · under a minute</span></div></div></div>'+
      '<div class="foot"><button class="btn-dark" type="button" onclick="start()">'+dia(14)+'Begin</button></div><p class="fnote">'+NOTE+'</p>';
  } else if(stage==='done'){
    html+='<div class="sh-top">'+dots()+'<span></span></div>'+
      '<div class="body"><div class="hero slide"><div class="badge">'+dia(44)+'</div><h3>Thank you for sharing your preferences</h3><p>We look forward to the pleasure of welcoming you.</p></div></div>'+
      '<div class="foot"><button class="btn-dark" type="button" onclick="closeSheet()">'+dia(14)+'Continue</button></div>';
  } else {
    var q=Q[step], a=A[q.key], last=step===Q.length-1;
    var opts=q.opts.map(function(o,i){var on=a.indexOf(o.v)>=0;
      return '<button class="opt'+(on?' on':'')+'" type="button" role="'+(q.multi?'checkbox':'radio')+'" aria-checked="'+on+'" onclick="pick('+i+')">'+
        '<span class="box'+(q.multi?'':' rd')+'">'+svg('check')+'</span><span class="t"><b>'+o.v+(o.other?':':'')+'</b>'+(o.d?'<small>'+o.d+'</small>':'')+'</span></button>'+
        (o.other?'<div class="other'+(on?' on':'')+'" id="oth"><input type="text" maxlength="60" placeholder="'+o.other+'" value="'+OT[q.key].replace(/"/g,'&quot;')+'" oninput="otherIn(this.value)" aria-label="'+o.other+'"></div>':'');}).join('');
    html+='<div class="sh-top">'+dots()+'<span class="cnt">'+(step+1)+' of '+Q.length+'</span></div>'+
      '<div class="body"><div class="'+cls+'"><div class="eyebrow">'+dia(10)+(q.multi?'Select all that apply':'Select one')+(q.optional?' · optional':'')+'</div>'+
      '<h3>'+q.title+'</h3><div class="opts" role="'+(q.multi?'group':'radiogroup')+'">'+opts+'</div>'+
      (q.consent?'<button class="consent'+(consent?' on':'')+'" id="cons" type="button" role="checkbox" aria-checked="'+consent+'" onclick="toggleConsent()"><span class="box">'+svg('check')+'</span><span><b>'+CONSENT_T+'</b><p>'+CONSENT_P+'</p></span></button>':'')+
      '</div></div>'+
      '<div class="foot"><button class="btn-back" type="button" onclick="go(-1)" aria-label="Back">'+svg('back')+'</button>'+
        (q.optional&&!a.length?'<button class="btn-ghost" type="button" onclick="go(1)">Skip</button>':'')+
        '<button class="btn-dark'+(canNext()?'':' off')+'" id="nx" type="button" onclick="next()">'+(last?dia(14)+'Done':'Next')+'</button></div>';
  }
  $s.innerHTML=html;
}
function sync(){ /* update without re-animating */
  var q=Q[step], a=A[q.key];
  $s.querySelectorAll('.opt').forEach(function(b,i){var on=a.indexOf(q.opts[i].v)>=0;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
  var o=document.getElementById('oth'); if(o){var was=o.classList.contains('on'),now=a.indexOf('Other')>=0;o.classList.toggle('on',now);if(now&&!was)setTimeout(function(){o.querySelector('input').focus()},60)}
  var t=$s.querySelector('.dots');if(t)t.outerHTML=dots();
  var nx=document.getElementById('nx');nx.classList.toggle('off',!canNext());
  var foot=$s.querySelector('.foot'), sk=foot.querySelector('.btn-ghost');
  if(q.optional){if(a.length&&sk)sk.remove();else if(!a.length&&!sk){var b=document.createElement('button');b.className='btn-ghost';b.type='button';b.textContent='Skip';b.onclick=function(){go(1)};foot.insertBefore(b,nx)}}
}
function pick(i){
  var q=Q[step], o=q.opts[i], a=A[q.key], has=a.indexOf(o.v)>=0;
  if(!q.multi){A[q.key]=has?[]:[o.v]}
  else if(o.all){A[q.key]=has?[]:GAMES.concat([o.v])}
  else if(o.solo){A[q.key]=has?[]:[o.v]}
  else{
    a=a.filter(function(x){return !q.opts.some(function(p){return p.solo&&p.v===x})});
    if(has)a=a.filter(function(x){return x!==o.v});else a.push(o.v);
    var allO=q.opts.find(function(p){return p.all});
    if(allO){var full=GAMES.every(function(g){return a.indexOf(g)>=0});a=a.filter(function(x){return x!==allO.v});if(full)a.push(allO.v)}
    A[q.key]=a;
  }
  sync();
  if(!q.multi&&A[q.key].length&&!o.other&&step<Q.length-1)setTimeout(function(){if(stage==='q'&&Q[step]===q)go(1)},420);
}
function otherIn(v){OT[Q[step].key]=v;document.getElementById('nx').classList.toggle('off',!canNext());var t=$s.querySelector('.dots');if(t)t.outerHTML=dots()}
function toggleConsent(){consent=!consent;var c=document.getElementById('cons');c.classList.toggle('on',consent);c.setAttribute('aria-checked',consent);document.getElementById('nx').classList.toggle('off',!canNext())}
function start(){stage='q';step=0;dir=1;render()}
function go(d){
  if(d<0&&step===0){stage='intro';dir=-1;render();return}
  var n=step+d;if(n<0)return;if(n>=Q.length){finish();return}dir=d;step=n;render();
}
function next(){
  if(!canNext()){
    var q=Q[step];
    if(q.consent&&answered(step)&&!consent){var c=document.getElementById('cons');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
    else{var o=$s.querySelector('.opts');o.classList.remove('shake');void o.offsetWidth;o.classList.add('shake')}
    return;
  }
  if(step===Q.length-1){finish();return}
  go(1);
}
function finish(){
  stage='done';render();confetti();
  var out={consent:consent};Q.forEach(function(q){out[q.key]=A[q.key].map(function(v){return v==='Other'?'Other: '+OT[q.key].trim():v})});
  console.log('survey',JSON.stringify(out));
}
function confetti(){
  var dev=document.getElementById('dev'),cols=['url(#vg-gold)','#f8dd93','#dcae48','#9c8570','#c4b799'];
  for(var i=0;i<26;i++){var h=10+Math.random()*12,d=document.createElement('span');d.className='conf';
    d.style.cssText='left:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*.7)+'s;animation-duration:'+(2.2+Math.random()*1.4)+'s';
    d.innerHTML='<svg style="height:'+h+'px;width:'+(h*.523)+'px;display:block;fill:'+(i===0?'#ed1c24':cols[i%cols.length])+'" viewBox="0 0 140 267.68"><use href="#vg-d"/></svg>';
    dev.appendChild(d);setTimeout(function(x){return function(){x.remove()}}(d),4000)}
}
function openSheet(){document.getElementById('reopen').hidden=true;if(stage==='done'){stage='intro';Q.forEach(function(q){A[q.key]=[];OT[q.key]=''});consent=false}render();
  document.getElementById('scrim').classList.add('on');document.getElementById('sheet').classList.add('on')}
function closeSheet(){document.getElementById('scrim').classList.remove('on');document.getElementById('sheet').classList.remove('on');
  var r=document.getElementById('reopen');r.innerHTML=dia(14)+'Replay the survey (demo)';r.hidden=stage!=='done'}

function fit(){var k=Math.min(1,(innerHeight-48)/876,(innerWidth-48)/417);var s=document.getElementById('stage');s.style.transform='scale('+k+')';s.style.margin=(876*(k-1)/2)+'px '+(417*(k-1)/2)+'px'}
addEventListener('resize',fit);fit();
render();setTimeout(openSheet,300);
</script>
<style>.opts.shake{animation:shake .45s}</style>
